name: MLB Morning Routine

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM EDT (UTC-4); GitHub cron runs in UTC
  workflow_dispatch:         # also allows manual trigger

env:
  TZ: America/New_York      # so datetime.now() in Python returns Eastern time

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests python-dotenv tzdata

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google_credentials.json

      - name: Create .env file
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      - name: Grade yesterday's bets
        run: python grade_bets.py

      - name: Pause
        run: sleep 30

      - name: Fetch today's odds
        run: python fetch_odds.py

      - name: Pause
        run: sleep 30

      - name: Analyze edges
        run: python analyze_edges.py

      - name: Pause
        run: sleep 30

      - name: Write to sheets
        run: python write_sheets.py

      # Runs LAST so it audits the state the morning actually produced, and
      # continue-on-error so a finding — or an API hiccup inside the audit — can
      # never fail a run whose picks already published successfully.
      #
      # Here because 2026-08-09/10 produced six bugs that threw no exception and
      # wrote no error: CLV was 0-for-535 rows, the evening pass was overwriting the
      # shadow tabs with TOMORROW's games, 1,033 rows were never graded because the
      # grader ran once per row and gave up, accented player names never matched, and
      # two columns rendered correct values as nonsense. Every one was found by a
      # human reading cells. This puts that check in front of someone daily instead
      # of waiting for the next time somebody happens to look.
      # if:always() so it still runs when an earlier step CRASHED — that is precisely
      # when you want the report, and a pipeline that dies silently just leaves
      # yesterday's numbers sitting there looking normal. The audit writes a
      # 'Pipeline Health' tab in the workbook, so a stale timestamp there is itself
      # the alarm that the morning run never finished.
      - name: Pipeline audit (writes Pipeline Health tab)
        if: always()
        continue-on-error: true
        run: python pipeline_audit.py
