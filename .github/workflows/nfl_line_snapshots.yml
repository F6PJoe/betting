name: NFL Line Snapshots (CLV)

# INSTRUMENTATION ONLY — captures closing lines for CLV. No analysis, no picks.
#
# WHY THE TIMES LOOK ODD
# ----------------------
# The closing line worth measuring is the one AFTER the inactive list drops,
# which happens exactly 90 minutes before kickoff and moves lines materially —
# a QB scratch is worth points, not cents. So a snapshot has to land inside
# [kickoff-90min, kickoff].
#
# But GitHub Actions cron fires LATE (measured here: median 54 min, max 302).
# Aiming a single cron at T-90 can therefore land after kickoff. The answer is
# DENSITY, not better aim.
#
# COST: a lines-only firing is ~3 credits, so density is nearly free. Firings
# inside the final 60 minutes also refresh PROPS (7 x remaining games), because
# otherwise a prop's "closing" price is the morning price carried forward — see
# --props-if-kickoff-within in nfl_fetch_odds.py. Budgeted ~2,800/month against
# a 20,000 plan with MLB finished.
#
# DAYLIGHT SAVING is handled by GENERATING the grid from the real schedule in
# the correct offset (scratchpad/gen_crons.py), not by widening windows to
# straddle both. The 2026 season crosses the 1 Nov change and the previous
# EDT-built grid would have fired an hour early on every remaining game.
#
# Games that have already kicked off are skipped by the fetcher, and empty
# responses are free, so out-of-window firings cost little.

on:
  schedule:
  # GENERATED — do not hand-edit. Run nfl_gen_snapshot_crons.py and paste.
  #
  # Rebuilt 2026-10-27 for EASTERN STANDARD TIME from the real remaining
  # schedule. The previous grid was built for EDT and the clocks go back on
  # 1 Nov: every kickoff moves an hour later in UTC (the Sunday slate alone,
  # 93 games, 17:00 -> 18:00), so it would have fired an hour early on all of
  # them. Generating from the schedule also picks up the Thanksgiving, Black
  # Friday, Saturday and Christmas slots, which are not in the weekly pattern.
  #
  # THE GUARANTEE THESE TIMES BUY
  # A firing scheduled at lead l lands at (l - lag) minutes before kickoff, so
  # it falls inside the final 60 minutes exactly when lag is in [l-60, l).
  # Leads step by <= 60 from 350 down to 20, so those intervals OVERLAP and the
  # safe range is continuous rather than a set of hopeful guesses.
  #
  # Swept every lag from 0 to 420 against all 165 remaining games: every game
  # gets a firing inside the hour before kickoff for ANY lag up to 349 minutes.
  # Measured lag over 100 real runs of this workflow was median 61, 95th pct
  # 197, max 243 — so there is ~107 minutes of headroom beyond the worst ever
  # observed. The failure mode being insured against is not one slow run but
  # CORRELATED delay, when scheduler congestion makes every cron in a window
  # late together.
  #
  # Nothing sits on :00 or :30 — measured, the worst delays came from those.
    - cron: '3 0 * * 0'
    - cron: '15 0 * * 0'
    - cron: '33 0 * * 0'
    - cron: '45 0 * * 0'
    - cron: '3 1 * * 0'
    - cron: '40 8 * * 0'
    - cron: '10 9 * * 0'
