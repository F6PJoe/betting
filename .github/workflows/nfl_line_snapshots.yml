concurrency:
  group: nfl-line-snapshots
  cancel-in-progress: false

env:
  TZ: America/New_York

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests python-dotenv tzdata
                          nfl_data_py pandas appdirs fastparquet pdfplumber

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google_credentials.json

      - name: Create .env file
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      # --lines-only skips the per-event prop calls: ~19 credits instead of ~149.
      # --only-if-kickoff-within 6 exits free when nothing kicks off soon: the
      # crons are day-of-week based, so without it every Sunday and Monday fires
      # in bye weeks and the off-season (Sun Sep 6 alone: 18 fires, zero games).
      # --props-if-kickoff-within 60 (MINUTES) refreshes player props on the
      # firings that land inside the final ~60 minutes, so a prop's closing
      # line is a real one. Without it --lines-only carried the MORNING prop
      # prices forward under a fresh timestamp, and prop CLV was comparing a
      # morning line against another morning line — it never saw the T-90
      # inactive report, which is the biggest mover of a player's line.
      #
      # 60 minutes, not hours: each pass costs 7 x remaining games, and there
      # are 6-9 firings per kickoff window. A tight band means only the two or
      # three that land inside it pay for props (~1,200 credits/month), while
      # the earlier firings stay on the cheap lines-only path.
      - name: Snapshot lines (props inside the final 60 min)
        run: python nfl_fetch_odds.py --lines-only --only-if-kickoff-within 6
                                      --props-if-kickoff-within 60

      # --snapshot-only writes the Line Log (what closing-line capture reads to
      # find "the last snapshot strictly before kickoff") and captures closing
      # lines for anything that kicked off since the last run — and skips the
      # projection engine entirely. A full run here would re-download a season
      # of play-by-play on every one of Sunday's ~18 firings, and would freeze
      # new Bet History entry lines at arbitrary mid-afternoon moments instead
      # of at the morning read. Measured: ~9s vs minutes.
      - name: Log lines + capture closing/CLV
        run: python nfl_analyze_edges.py --snapshot-only
