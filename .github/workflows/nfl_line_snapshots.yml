name: NFL Line Snapshots (CLV)

# INSTRUMENTATION ONLY — captures closing lines for CLV. No analysis, no picks.
# Uses --lines-only (~19 credits) instead of the morning run's ~149 with props.
#
# WHY THE TIMES LOOK ODD
# ----------------------
# The closing line worth measuring is the one AFTER the inactive list drops,
# which happens exactly 90 minutes before kickoff and moves lines materially —
# a QB scratch is worth points, not cents. So a snapshot has to land inside
# [kickoff-90min, kickoff].
#
# But GitHub Actions cron fires 29-57 MINUTES LATE (measured on this repo:
# 08:00->08:44, 08:00->08:47, 18:30->18:59, 12:30->13:27). Aiming a single cron
# at T-90 can therefore land after kickoff. The answer is DENSITY, not better
# aim: several crons per kickoff window so at least one lands inside it.
#
# DAYLIGHT SAVING: cron is UTC and the NFL season crosses the DST change
# (1 Nov 2026). A 1:00 PM ET kickoff is 17:00 UTC in EDT but 18:00 UTC in EST.
# The windows below are deliberately widened to cover BOTH, which costs a few
# extra 19-credit snapshots rather than risking a missed close.
# >>> REVIEW THESE TIMES IN EARLY NOVEMBER once EST is in effect. <<<
#
# Games that have already kicked off are skipped by the fetcher, and empty
# responses are free, so out-of-window firings cost little.

on:
  schedule:
  # SNAPSHOT PLACEMENT — rebuilt 2026-09-03 from MEASURED lag, not assumption.
  #
  # GitHub Actions cron does not fire on time. Measured across real fires:
  #   snapshot workflow  median 54m late, MAX 302m
  #   morning workflow   median 258m late
  # A cron aimed exactly at T-90 can therefore land after kickoff, which would
  # capture a closing line from BEFORE the inactive report and quietly make
  # every CLV number for that game wrong.
  #
  # Two mitigations, both applied below:
  #  1. NOTHING ON :00 OR :30. Every previous cron sat on one of those slots —
  #     the most contested minutes on GitHub's scheduler, since that is where
  #     everyone points theirs. The 302m outliers all came from them.
  #  2. DENSITY, NOT PRECISION. Six crons per kickoff window spanning T-150 to
  #     T-25. At the median 54m lag those land ~T-96 through ~T+29, so several
  #     fall inside the T-90-to-kickoff window even when individual fires drift.
  #
  # capture_closing_and_clv() takes the LAST snapshot strictly before kickoff,
  # so extra fires are free accuracy — the only failure mode is having none.
  #
  # NOTE: new cron schedules take a cycle (~12h) to register with GitHub.
    - cron: '37 14 * * 0'   # Sun 14:37Z  ~T-150 for Sun 1:00pm ET
    - cron: '55 14 * * 0'   # Sun 14:55Z  ~T-125 for Sun 1:00pm ET
    - cron: '20 15 * * 0'   # Sun 15:20Z  ~T-100 for Sun 1:00pm ET
    - cron: '45 15 * * 0'   # Sun 15:45Z  ~T-75 for Sun 1:00pm ET
    - cron: '10 16 * * 0'   # Sun 16:10Z  ~T-50 for Sun 1:00pm ET
    - cron: '35 16 * * 0'   # Sun 16:35Z  ~T-25 for Sun 1:00pm ET
    - cron: '55 17 * * 0'   # Sun 17:55Z  ~T-150 for Sun 4:25pm ET
    - cron: '20 18 * * 0'   # Sun 18:20Z  ~T-125 for Sun 4:25pm ET
    - cron: '45 18 * * 0'   # Sun 18:45Z  ~T-100 for Sun 4:25pm ET
    - cron: '10 19 * * 0'   # Sun 19:10Z  ~T-75 for Sun 4:25pm ET
    - cron: '35 19 * * 0'   # Sun 19:35Z  ~T-50 for Sun 4:25pm ET
    - cron: '7 20 * * 0'   # Sun 20:07Z  ~T-25 for Sun 4:25pm ET
    - cron: '50 21 * * 0'   # Sun 21:50Z  ~T-150 for Sun 8:20pm ET
    - cron: '15 22 * * 0'   # Sun 22:15Z  ~T-125 for Sun 8:20pm ET
    - cron: '40 22 * * 0'   # Sun 22:40Z  ~T-100 for Sun 8:20pm ET
    - cron: '5 23 * * 0'   # Sun 23:05Z  ~T-75 for Sun 8:20pm ET
    - cron: '37 23 * * 0'   # Sun 23:37Z  ~T-50 for Sun 8:20pm ET
    - cron: '55 23 * * 0'   # Sun 23:55Z  ~T-25 for Sun 8:20pm ET
    - cron: '45 21 * * 1'   # Mon 21:45Z  ~T-150 for Mon 8:15pm ET
    - cron: '10 22 * * 1'   # Mon 22:10Z  ~T-125 for Mon 8:15pm ET
    - cron: '35 22 * * 1'   # Mon 22:35Z  ~T-100 for Mon 8:15pm ET
    - cron: '7 23 * * 1'   # Mon 23:07Z  ~T-75 for Mon 8:15pm ET
    - cron: '25 23 * * 1'   # Mon 23:25Z  ~T-50 for Mon 8:15pm ET
    - cron: '50 23 * * 1'   # Mon 23:50Z  ~T-25 for Mon 8:15pm ET
    - cron: '50 21 * * 3'   # Wed 21:50Z  ~T-150 for Wed 8:20pm ET
    - cron: '15 22 * * 3'   # Wed 22:15Z  ~T-125 for Wed 8:20pm ET
    - cron: '40 22 * * 3'   # Wed 22:40Z  ~T-100 for Wed 8:20pm ET
    - cron: '5 23 * * 3'   # Wed 23:05Z  ~T-75 for Wed 8:20pm ET
    - cron: '37 23 * * 3'   # Wed 23:37Z  ~T-50 for Wed 8:20pm ET
    - cron: '55 23 * * 3'   # Wed 23:55Z  ~T-25 for Wed 8:20pm ET
    - cron: '45 21 * * 4'   # Thu 21:45Z  ~T-150 for Thu 8:15pm ET
    - cron: '10 22 * * 4'   # Thu 22:10Z  ~T-125 for Thu 8:15pm ET
    - cron: '35 22 * * 4'   # Thu 22:35Z  ~T-100 for Thu 8:15pm ET
    - cron: '7 23 * * 4'   # Thu 23:07Z  ~T-75 for Thu 8:15pm ET
    - cron: '25 23 * * 4'   # Thu 23:25Z  ~T-50 for Thu 8:15pm ET
    - cron: '50 23 * * 4'   # Thu 23:50Z  ~T-25 for Thu 8:15pm ET

  workflow_dispatch:

env:
  TZ: America/New_York

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests python-dotenv tzdata
                          nfl_data_py pandas appdirs fastparquet pdfplumber

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google_credentials.json

      - name: Create .env file
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      # --lines-only skips the per-event prop calls: ~19 credits instead of ~149.
      - name: Snapshot lines (no props)
        run: python nfl_fetch_odds.py --lines-only

      # --snapshot-only writes the Line Log (what closing-line capture reads to
      # find "the last snapshot strictly before kickoff") and captures closing
      # lines for anything that kicked off since the last run — and skips the
      # projection engine entirely. A full run here would re-download a season
      # of play-by-play on every one of Sunday's ~18 firings, and would freeze
      # new Bet History entry lines at arbitrary mid-afternoon moments instead
      # of at the morning read. Measured: ~9s vs minutes.
      - name: Log lines + capture closing/CLV
        run: python nfl_analyze_edges.py --snapshot-only
