name: MLB Line Snapshots (CLV)

# Line snapshots through the day. These passes fetch LINES ONLY — no player props —
# which costs 1 credit/game instead of 5. That is what makes running six of them
# cheaper than the two full prop refetches this replaced.
#
# Spread across the afternoon and evening so that every game, whatever time it
# starts, has a snapshot shortly before its own first pitch. A single fixed time
# cannot do that for a slate running 1pm to 10pm ET: at 6:30pm the afternoon games
# have already finished, which is why 6:30 CLV was empty for most of the slate.
# HOURLY, 11am-9pm ET. Measured 2026-08-10: GitHub fires these 29-57 minutes late
# (08:00 -> 08:44, 08:00 -> 08:47, 18:30 -> 18:59, 12:30 -> 13:27). With that much
# jitter you cannot aim a snapshot at a kickoff — one set for 6:45pm can land at
# 7:30, after first pitch. Density is the answer, not precision: run often enough
# that wherever the runs actually land, one sits close to every game.
#
# On the old 2-hour grid most games were priced against a line 1-2 hours stale
# (7:46pm game -> last snapshot 6:00pm = 106 minutes). Every 30 minutes cuts the
# worst case to roughly half an hour.
#
# Each pass is lines-only: 3 credits flat plus 1 per upcoming game, so ~18 early in
# the day falling to ~4 late. Passes after the last first pitch return no games, and
# empty responses are free per the API docs — which is why the window runs to 11pm.
# It costs nothing and insures against a late start.
#
#     every 30 min  ->  ~302/day snapshots + 78 morning props = 11,400/month
#     with NFL at similar game-day density                    = ~14,400/month (72%)
#
# Every 20 minutes was modelled and rejected: 18,750/month leaves under 1,300 credits
# of margin, so one heavy slate or a costlier-than-expected NFL props build would hit
# the wall mid-month. Credit usage is now reported on the Pipeline Health tab.
on:
  schedule:
    - cron: '0 15 * * *'      # 11:00 AM ET
    - cron: '30 15 * * *'     # 11:30 AM ET
    - cron: '0 16 * * *'      # 12:00 PM ET
    - cron: '30 16 * * *'     # 12:30 PM ET
    - cron: '0 17 * * *'      #  1:00 PM ET
    - cron: '30 17 * * *'     #  1:30 PM ET
    - cron: '0 18 * * *'      #  2:00 PM ET
    - cron: '30 18 * * *'     #  2:30 PM ET
    - cron: '0 19 * * *'      #  3:00 PM ET
    - cron: '30 19 * * *'     #  3:30 PM ET
    - cron: '0 20 * * *'      #  4:00 PM ET
    - cron: '30 20 * * *'     #  4:30 PM ET
    - cron: '0 21 * * *'      #  5:00 PM ET
    - cron: '30 21 * * *'     #  5:30 PM ET
    - cron: '0 22 * * *'      #  6:00 PM ET
    - cron: '30 22 * * *'     #  6:30 PM ET
    - cron: '0 23 * * *'      #  7:00 PM ET
    - cron: '30 23 * * *'     #  7:30 PM ET
    - cron: '0 0 * * *'       #  8:00 PM ET
    - cron: '30 0 * * *'      #  8:30 PM ET
    - cron: '0 1 * * *'       #  9:00 PM ET
    - cron: '30 1 * * *'      #  9:30 PM ET
    - cron: '0 2 * * *'       # 10:00 PM ET
    - cron: '30 2 * * *'      # 10:30 PM ET
    - cron: '0 3 * * *'       # 11:00 PM ET
  workflow_dispatch:        # allows manual trigger

env:
  TZ: America/New_York     # so datetime.now() in Python returns Eastern time

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests python-dotenv tzdata

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google_credentials.json

      - name: Create .env file
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      # --lines-only: h2h/spreads/totals + team_totals, no player props.
      # 18 credits for a 15-game slate instead of 78.
      - name: Fetch lines (no player props)
        run: python fetch_odds.py --lines-only

      - name: Pause
        run: sleep 30

      # --force routes this to the CLV update path and skips every snapshot rewrite,
      # so the shadow tabs keep their morning data.
      - name: Update CLV + capture Line History
        run: python analyze_edges.py --force
