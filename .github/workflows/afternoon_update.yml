name: MLB Afternoon/Evening Update

on:
  schedule:
    - cron: '30 16 * * *'  # 12:30 PM EDT (UTC-4)
    - cron: '30 22 * * *'  #  6:30 PM EDT (UTC-4)
  workflow_dispatch:        # allows manual trigger

env:
  TZ: America/New_York     # so datetime.now() in Python returns Eastern time

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests python-dotenv tzdata

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google_credentials.json

      - name: Create .env file
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      - name: Fetch updated odds
        run: python fetch_odds.py

      - name: Pause
        run: sleep 30

      - name: Update CLV snapshots
        run: python analyze_edges.py --force
